<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Zendure zenSDK Proxy Dynamic Load Balancing</title>
  <desc id="desc">Banner for a Node-RED based three-phase dynamic load balancing extension for the Zendure zenSDK proxy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="0.58" stop-color="#18343b"/>
      <stop offset="1" stop-color="#0e5e5a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" x2="1">
      <stop offset="0" stop-color="#60d394"/>
      <stop offset="1" stop-color="#f6c453"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="330" rx="26" fill="url(#bg)"/>
  <g opacity=".12" stroke="#fff" fill="none">
    <path d="M0 248 C180 180 300 300 470 225 S790 150 1200 238" stroke-width="3"/>
    <path d="M0 274 C190 210 330 318 510 245 S835 190 1200 266" stroke-width="2"/>
  </g>
  <g transform="translate(70 55)">
    <rect width="210" height="220" rx="28" fill="#0d2127" stroke="#4fd1c5" stroke-width="2"/>
    <rect x="34" y="31" width="142" height="158" rx="20" fill="#132f36" stroke="#6ee7d8" stroke-width="2"/>
    <path d="M112 55 L79 113 H106 L91 165 L145 96 H117 L137 55 Z" fill="url(#bolt)"/>
    <text x="105" y="207" text-anchor="middle" fill="#d8fffb" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">DLB</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#fff">
    <text x="335" y="112" font-size="48" font-weight="800">Zendure zenSDK Proxy</text>
    <text x="335" y="163" font-size="34" font-weight="700" fill="#72e6d8">Dynamic Load Balancing</text>
    <text x="337" y="205" font-size="21" fill="#d4e8e8">Three-phase protection • P1 feedback • safe redistribution • Node-RED</text>
  </g>
  <g transform="translate(338 238)" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">
    <rect width="145" height="40" rx="20" fill="#173f45" stroke="#59d8ca"/>
    <text x="72.5" y="26" text-anchor="middle" fill="#c9fffa">L1 protected</text>
    <rect x="160" width="145" height="40" rx="20" fill="#173f45" stroke="#59d8ca"/>
    <text x="232.5" y="26" text-anchor="middle" fill="#c9fffa">L2 protected</text>
    <rect x="320" width="145" height="40" rx="20" fill="#173f45" stroke="#59d8ca"/>
    <text x="392.5" y="26" text-anchor="middle" fill="#c9fffa">L3 protected</text>
  </g>
</svg>
